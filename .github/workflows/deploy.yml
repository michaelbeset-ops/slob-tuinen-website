name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # De deploy-stap gebruikt zijn eigen token. Zonder dit blijft het
          # workflow-token tijdens de hele build in .git/config staan, waar elk
          # build- of installatiescript erbij kan.
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile: installeer exact wat in pnpm-lock.yaml staat.
        # Met --no-frozen-lockfile mocht CI stilzwijgend nieuwere (en dus
        # ongecontroleerde) versies binnenhalen dan lokaal getest zijn.
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
